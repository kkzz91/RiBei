org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Parallel builds and build cache
org.gradle.parallel=true
org.gradle.caching=true
# Pin JDK 17 (this machine's default JAVA_HOME is JDK 8, which Gradle 9 rejects)
org.gradle.java.home=D:/honmeng/DevEco-Device-Tool/core/tool_openjdk_jre
android.useAndroidX=true
# Do not let AGP download SDK components: dl.google.com is extremely slow here
android.builder.sdkDownload=false
# Kotlin incremental caches cannot relativize paths when the pub cache (C:) and the
# project (E:) are on different Windows drives. This app is tiny, so full Kotlin
# compilation on every build costs only a few seconds.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
